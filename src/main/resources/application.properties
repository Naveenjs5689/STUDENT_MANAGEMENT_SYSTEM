

spring.application.name=student-management-backend
server.port=8082

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.demo.admin1.username=${DEMO_ADMIN1_USERNAME:admin1}
app.demo.admin1.password=${DEMO_ADMIN1_PASSWORD:Admin@123}
app.demo.admin2.username=${DEMO_ADMIN2_USERNAME:admin2}
app.demo.admin2.password=${DEMO_ADMIN2_PASSWORD:Admin2@123}
app.demo.student.username=${DEMO_STUDENT_USERNAME:student}
app.demo.student.password=${DEMO_STUDENT_PASSWORD:Student@123}

