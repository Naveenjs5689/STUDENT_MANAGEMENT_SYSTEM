
spring.application.name=student-management-backend
server.port=${PORT:8082}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.demo.admin1.username=${DEMO_ADMIN1_USERNAME}
app.demo.admin1.password=${DEMO_ADMIN1_PASSWORD}
app.demo.admin2.username=${DEMO_ADMIN2_USERNAME}
app.demo.admin2.password=${DEMO_ADMIN2_PASSWORD}
app.demo.student.username=${DEMO_STUDENT_USERNAME}
app.demo.student.password=${DEMO_STUDENT_PASSWORD}
